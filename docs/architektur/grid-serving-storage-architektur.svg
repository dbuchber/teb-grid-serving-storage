<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" style="font:12px system-ui,sans-serif" role="img"
     aria-label="Architecture: the grid operator sends signed calls via OpenADR or LoRaWAN to the box next to the meter; only the box's core module creates setpoints for the battery inverter via SunSpec, EEBUS or IEEE 2030.5; the smart meter sends 15-minute values to the grid operator; the smart-home system has its own channel to the box and may request charging and discharging, which the box checks against its limits; large storage is controlled by telecontrol with acknowledgement.">
  <style>svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--line:#e1e0d9;--accent:#2a78d6;--ok:#006300;background:#fcfcfb}</style><defs>
    <marker id="arch-cmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/>
    </marker>
    <marker id="arch-met" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--ok)"/>
    </marker>
    <marker id="arch-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/>
    </marker>
  </defs>
    <g style="stroke:var(--ink2);fill:var(--surface)">
    <rect x="40" y="20" width="680" height="62" rx="8"/>
    <rect x="190" y="152" width="390" height="150" rx="8" style="stroke:var(--accent);stroke-width:2"/>
    <rect x="202" y="188" width="112" height="100" rx="5"/>
    <rect x="322" y="188" width="140" height="100" rx="5" style="stroke:var(--accent)"/>
    <rect x="470" y="188" width="100" height="100" rx="5"/>
    <rect x="4" y="190" width="158" height="84" rx="6" style="stroke-dasharray:4 3"/>
    <rect x="604" y="152" width="148" height="150" rx="8" style="stroke-dasharray:4 3"/>
    <rect x="200" y="372" width="190" height="62" rx="6"/>
    <rect x="410" y="372" width="150" height="62" rx="6"/>
  </g>
  <g style="fill:var(--ink)">
    <text x="380" y="44" text-anchor="middle" font-weight="600" font-size="13">Grid operator (DSO)</text>
    <text x="380" y="62" text-anchor="middle" style="fill:var(--ink2)">detects the bottleneck · signs calls in a hardware security module · checks meter data · pays compensation</text>
    <text x="385" y="174" text-anchor="middle" font-weight="600" font-size="13">Box next to the meter</text>
    <text x="258" y="208" text-anchor="middle" font-weight="600">Radio / network</text>
    <text x="258" y="228" text-anchor="middle" style="fill:var(--ink2)">LoRaWAN</text>
    <text x="258" y="244" text-anchor="middle" style="fill:var(--ink2)">mobile radio</text>
    <text x="258" y="260" text-anchor="middle" style="fill:var(--ink2)">Ethernet</text>
    <text x="258" y="278" text-anchor="middle" style="fill:var(--muted)" font-size="11">no setpoints</text>
    <text x="392" y="208" text-anchor="middle" font-weight="600" style="fill:var(--accent)">Core module</text>
    <text x="392" y="228" text-anchor="middle" style="fill:var(--ink2)">security chip</text>
    <text x="392" y="244" text-anchor="middle" style="fill:var(--ink2)">checks signature,</text>
    <text x="392" y="260" text-anchor="middle" style="fill:var(--ink2)">segment, fixed limits</text>
    <text x="392" y="278" text-anchor="middle" style="fill:var(--muted)" font-size="11">only source of setpoints</text>
    <text x="520" y="208" text-anchor="middle" font-weight="600">Field</text>
    <text x="520" y="228" text-anchor="middle" style="fill:var(--ink2)">inverter link</text>
    <text x="520" y="244" text-anchor="middle" style="fill:var(--ink2)">meter interface</text>
    <text x="520" y="260" text-anchor="middle" style="fill:var(--ink2)">relays, inputs</text>
    <text x="83" y="212" text-anchor="middle" font-weight="600">Smart-home system</text>
    <text x="83" y="230" text-anchor="middle" font-size="11" style="fill:var(--ink2)">reads data, requests</text>
    <text x="83" y="244" text-anchor="middle" font-size="11" style="fill:var(--ink2)">charging and discharging;</text><text x="83" y="258" text-anchor="middle" font-size="11" style="fill:var(--ink2)">the box applies its limits</text>
    <text x="678" y="176" text-anchor="middle" font-weight="600">Large storage</text>
    <text x="678" y="192" text-anchor="middle" style="fill:var(--ink2)">from 250 kW, no box</text>
    <text x="678" y="216" text-anchor="middle" style="fill:var(--ink2)">plant controller</text>
    <text x="678" y="232" text-anchor="middle" style="fill:var(--ink2)">telecontrol</text>
    <text x="678" y="248" text-anchor="middle" style="fill:var(--ink2)">(IEC 60870-5-104)</text>
    <text x="678" y="264" text-anchor="middle" style="fill:var(--ink2)">or OpenADR 3,</text>
    <text x="678" y="280" text-anchor="middle" style="fill:var(--ink2)">with acknowledgement</text>
    <text x="295" y="398" text-anchor="middle" font-weight="600">Battery inverter + battery</text>
    <text x="295" y="418" text-anchor="middle" style="fill:var(--ink2)">limits of the manufacturer</text>
    <text x="485" y="398" text-anchor="middle" font-weight="600">Smart meter</text>
    <text x="485" y="418" text-anchor="middle" style="fill:var(--ink2)">calibrated, 15 min</text>
  </g>
  <g style="stroke:var(--ink2);stroke-width:1.5;fill:none">
    <path d="M380,82 V142" style="stroke:var(--accent);stroke-width:2.5" marker-end="url(#arch-cmd)"/>
    <path d="M678,82 V150" marker-end="url(#arch-arr)"/>
    <path d="M295,302 V370" style="stroke:var(--accent);stroke-width:2.5" marker-start="url(#arch-cmd)" marker-end="url(#arch-cmd)"/>
    <path d="M485,370 V302" stroke-dasharray="4 3" marker-end="url(#arch-arr)"/>
    <path d="M190,232 H164" stroke-dasharray="4 3" marker-start="url(#arch-arr)" marker-end="url(#arch-arr)"/>
    <path d="M560,403 H596 V82" style="stroke:var(--ok);stroke-width:2.5" marker-end="url(#arch-met)"/>
  </g>
  <g><circle cx="394" cy="98" r="9" style="fill:var(--accent)"/><text x="394" y="102" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--surface)">1</text><circle cx="334" cy="188" r="9" style="fill:var(--accent)"/><text x="334" y="192" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--surface)">2</text><circle cx="309" cy="318" r="9" style="fill:var(--accent)"/><text x="309" y="322" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--surface)">3</text><circle cx="610" cy="330" r="9" style="fill:var(--ok)"/><text x="610" y="334" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--surface)">4</text></g>
  <g style="fill:var(--ink2)" font-size="11.5">
    <text x="372" y="108" text-anchor="end">one signed call reaches all boxes of a transformer:</text>
    <text x="372" y="124" text-anchor="end">OpenADR (Austrian rules) or LoRaWAN broadcast</text>
    <text x="372" y="140" text-anchor="end">same channel: prices, key updates (other roles)</text>
    <text x="287" y="328" text-anchor="end">SunSpec · EEBUS · IEEE 2030.5</text>
    <text x="287" y="344" text-anchor="end">setpoint, limits, ramp ↓ · power, charge ↑</text>
    <text x="493" y="334">reads, for</text><text x="493" y="348">self-consumption</text>
    <text x="604" y="420">15-min values next day:</text>
    <text x="604" y="436">verification, compensation</text>
    <text x="40" y="460" style="fill:var(--muted)"><tspan style="fill:var(--accent)">■</tspan> command path ① call ② check ③ setpoint · <tspan style="fill:var(--ok)">■</tspan> ④ measurement · dashed = optional or other class · no manufacturer cloud</text>
  </g>
</svg>