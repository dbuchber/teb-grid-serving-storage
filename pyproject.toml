[project]
name = "gridsim"
version = "0.1.0"
description = "Steyr-Netzsimulation (Heimspeicher, Wärmepumpen, E-Autos, V2G) und Rechen-API für die Live-Demo"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "pyproj>=3.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gridsim", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
